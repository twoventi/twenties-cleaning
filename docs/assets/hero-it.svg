<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
<title id="t">Schermata di Twenties</title><desc id="d">Finestra dell'app: le etichette dicono perché una cartella pesa, e lo Scarto è una stima, non un ordine di cancellare.</desc>
<style>
.win{fill:#FFFCF7;stroke:#D9CDB8} .tx{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#111114}
.mu{font:500 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5C574E}
.h{font:700 24px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#111114}
.track{fill:#ececf0} .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.7,.2,1) both}
.b2{animation-delay:.15s} .b3{animation-delay:.3s} .b4{animation-delay:.45s}
.card{animation:rise .9s cubic-bezier(.2,.7,.2,1) both} .c2{animation-delay:.5s}
.pulse{animation:pulse 2.4s ease-in-out 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.bar,.card,.pulse{animation:none}}
</style>
<rect x="8" y="8" width="624" height="404" rx="22" class="win"/>
<circle cx="36" cy="34" r="6" fill="#ff5f57"/><circle cx="58" cy="34" r="6" fill="#febc2e"/><circle cx="80" cy="34" r="6" fill="#28c840"/>
<text x="40" y="82" class="h">Vedi cosa pesa</text><text x="40" y="104" class="mu">Decidi tu</text>
<g class="card"><rect x="40" y="126" width="560" height="168" rx="16" fill="#f5f5f7"/>
<text x="64" y="164" class="tx">Giochi</text><text x="576" y="164" text-anchor="end" class="mu">182 GB</text><rect x="64" y="170" width="512" height="8" rx="4" class="track"/><rect x="64" y="170" width="317" height="8" rx="4" fill="#0F6E6B" class="bar b1"/><text x="64" y="200" class="tx">Documenti</text><text x="576" y="200" text-anchor="end" class="mu">120 GB</text><rect x="64" y="206" width="512" height="8" rx="4" class="track"/><rect x="64" y="206" width="209" height="8" rx="4" fill="#111114" class="bar b2"/><text x="64" y="236" class="tx">Doppioni</text><text x="576" y="236" text-anchor="end" class="mu">71 GB</text><rect x="64" y="242" width="512" height="8" rx="4" class="track"/><rect x="64" y="242" width="122" height="8" rx="4" fill="#1F6F6C" class="bar b3"/><text x="64" y="272" class="tx">Scarto</text><text x="576" y="272" text-anchor="end" class="mu">44 GB</text><rect x="64" y="278" width="512" height="8" rx="4" class="track"/><rect x="64" y="278" width="76" height="8" rx="4" fill="#C2410C" class="bar b4"/></g>
<g class="card c2 pulse"><rect x="40" y="312" width="270" height="76" rx="16" fill="#0F6E6B"/>
<text x="64" y="345" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Stima dello Scarto</text>
<text x="64" y="372" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">48,3 GB</text></g>
<g class="card c2"><rect x="330" y="312" width="270" height="76" rx="16" fill="#f5f5f7"/>
<path d="M366 336h28l-3 30a4 4 0 0 1-4 3.600h-14a4 4 0 0 1-4-3.600z M362 330h36 M372 330v-4h16v4" fill="none" stroke="#111114" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="416" y="345" class="tx">Sempre nel Cestino</text><text x="416" y="368" class="mu">Niente è cancellato per sempre</text></g>
</svg>